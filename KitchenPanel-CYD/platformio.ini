; Kitchen panel for the CYD "Cheap Yellow Display" ESP32-3248S035C
;   ESP32-D0WD-V3, 4 MB flash, 3.5" 320x480 ST7796, GT911 capacitive touch.
;
; Shows the house battery (Blynk V128 SOC, V124 volts, V129 watts) and drives the
; kitchen lights (V45 sink, V44 cooktop, V43 red hallway LED) through the local
; Blynk server's HTTP API.
;
; Board setup is taken from KeyLang (C:\Users\nik\AI_Proj\KeyLang\esp32), where
; it is proven on this exact board - see the notes there.

[env:cyd]
; espressif32 6.x = Arduino core 2.0.x (ledcSetup/ledcAttachPin API).
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; This board's auto-reset into the bootloader is unreliable on some USB ports.
; A long connect window leaves time to hold BOOT/IO0 manually.
upload_flags = --connect-attempts=30

; Wi-Fi + HTTP + LovyanGFX is close to the default 1.2 MB app partition.
board_build.partitions = huge_app.csv

; No BOARD_HAS_PSRAM: the core tests whether it is defined, not its value.
build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
